name: Build and Test React App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repo code onto GitHub's server
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install dependencies cleanly
      - name: Install dependencies
        run: npm ci

      # 4. Execute your build script
      - name: Run build
        run: npm run build
